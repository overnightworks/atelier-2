sonar.organization=overnightworks
sonar.projectKey=overnightworks_atelier-2
sonar.sources=src,frontend/src
sonar.tests=tests,frontend/tests
# why: Orval output from tests/api/openapi_frozen.json; the empty-regeneration
# gate owns it, not hand edits
sonar.exclusions=frontend/dist/**,frontend/build/**,frontend/.svelte-kit/**,docs/requirements/**/*.html,**/*.min.js,frontend/src/api/generated/**
# why: openapi_frozen.json is a generated API-contract snapshot, not authored test code
sonar.test.exclusions=tests/api/openapi_frozen.json
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# why: the "SonarCloud open findings" step in the `sonar` job (#1294) queries
# the analysis result right after the scan; without waiting for the quality
# gate that query would race the still-running server-side analysis.
sonar.qualitygate.wait=true

# The `sonar` job in .github/workflows/ci.yml downloads these from the
# `tests` and `frontend` jobs' report artifacts before scanning (#1203).
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.javascript.lcov.reportPaths=reports/frontend-coverage/lcov.info

# Rule classes that do not fit this project (#1203 triage). Each entry names why.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12

# why: uv on a local project with its own build backend cannot pass --no-build
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/**

# why: uv on a local project with its own build backend cannot pass --only-binary :all:
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile*

# why: uv on a local project with its own build backend cannot pass --no-build
sonar.issue.ignore.multicriteria.e3.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.e3.resourceKey=scripts/**/*.sh

# why: uv on a local project with its own build backend cannot pass --ignore-scripts
sonar.issue.ignore.multicriteria.e4.ruleKey=shell:S6505
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/**/*.sh

# why: SHA-256 here is a content-identity fingerprint, not a password digest
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S4790
sonar.issue.ignore.multicriteria.e5.resourceKey=src/atelier2/contracts/effect_requests.py

# why: loopback URL, not a network-exposed endpoint
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e6.resourceKey=src/atelier2/host/address.py

# why: loopback URL, not a network-exposed endpoint
sonar.issue.ignore.multicriteria.e7.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e7.resourceKey=src/atelier2/host/serving.py

# why: our exhaustive `match`/`case` style deliberately falls through to the code
# after the match with `pass` when a matched case needs no special handling
# (assert_never covers the unreachable arm); the one non-match hit is a
# side-effecting `while condition(): pass` retry loop. Neither is missing code.
sonar.issue.ignore.multicriteria.e8.ruleKey=python:S108
sonar.issue.ignore.multicriteria.e8.resourceKey=src/**

# why: every hit names a specific expected exception (UnicodeDecodeError,
# binascii.Error, json.JSONDecodeError, OperationalError/PoolTimeoutError, etc.)
# alongside a broader type already in the same tuple, as documentation of what
# the catch is for; the broader type would already catch it, so this is
# self-documentation, not a masked or duplicated catch (checked all 38 hits).
sonar.issue.ignore.multicriteria.e9.ruleKey=python:S5713
sonar.issue.ignore.multicriteria.e9.resourceKey=src/**

# why: this file's cleanup handlers deliberately catch BaseException per
# resource so one failing close() does not skip the rest, collect the errors,
# then re-raise them together (bare `raise` or `BaseExceptionGroup`) after all
# cleanup ran; a caught SystemExit is still re-raised, just from the
# aggregating statement further down rather than the same except block Sonar
# checks (checked all 9 hits, all in this one file).
sonar.issue.ignore.multicriteria.e10.ruleKey=python:S5754
sonar.issue.ignore.multicriteria.e10.resourceKey=src/atelier2/adapters/dbos/runtime.py

# why: our style builds a `pytest.raises` block's argument via a nested call
# inside the one statement under test (arrange, not a second action); an AST
# check of the flagged hits found no case that breaks this rationale.
sonar.issue.ignore.multicriteria.e11.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.e11.resourceKey=tests/**

# why: the files `run --workflow/--binding/--input-file` name are the operator's
# own choice on this machine, the same trust as the MCP artifact door (ADR
# 0009); a working-directory fence was built and measured counterproductive
# (#1242 gate), so this one file keeps reading what the operator names.
sonar.issue.ignore.multicriteria.e12.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e12.resourceKey=src/atelier2/host/__init__.py
