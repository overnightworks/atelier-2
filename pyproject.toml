[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "atelier-2"
version = "0.0.0"
license = "MIT"
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = "==3.12.13"
dependencies = [
    "dbos==2.29.0",
    "fastapi==0.141.1",
    "githubkit==0.16.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.1",
]

[project.scripts]
atelier2 = "atelier2.host:main"

[dependency-groups]
dev = [
    "import-linter==2.13",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "pyright==1.1.411",
    "ruff==0.16.2",
    "sqlglot==30.13.0",
    "vulture==2.16",
    "pytest-cov==7.1.0",
]

[tool.atelier2.verification]
# What verifies this project, stated by this project. A node that redeems the
# `run-project-verification` grant runs exactly this, so the statement lives with
# the source it verifies rather than in the atelier's own configuration. #1101
# pins the checkout into the attempt's own workspace before this runs, so the
# tree it needs is already there.
#
# `tests/crash` is excluded on purpose (#1152): the pipeline's own Python test
# job
# (.github/workflows/ci.yml) never bundles it with the rest either -- it runs
# alone, in the `crash-recovery` job, inside a systemd scope with cgroup
# delegation (`Delegate=yes`, `KillMode=control-group`) that a grant's
# workspace does not have and cannot give it. Declaring a command this runtime
# can honestly run is what lets what the grant runs match what the pipeline
# proves green; `tests/crash` keeps its own home in the pipeline's job list,
# which is its own and stays in .github/workflows/ci.yml.
command = [
    "uv",
    "run",
    "--locked",
    "pytest",
    "--dist",
    "loadgroup",
    "-n",
    "auto",
    "--ignore=tests/crash",
    "tests",
    "-q",
    "--cov=src/atelier2",
    "--cov-report=xml:reports/coverage.xml",
]
timeout_seconds = 1800

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
markers = [
    "proves(sentence_id): name the acceptance sentence this test proves; scripts/check_acceptance.py enforces the link",
]

[tool.pyright]
extraPaths = ["src"]

[tool.importlinter]
root_package = "atelier2"
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "layers"
name = "Atelier package layers"
type = "layers"
containers = ["atelier2"]
layers = [
    "__main__",
    "host",
    "api | adapters",
    "application",
    "ports",
    "contracts",
]
exhaustive = true

[[tool.importlinter.contracts]]
id = "root-facade"
name = "Root facade cannot bypass ports"
type = "forbidden"
source_modules = ["atelier2"]
forbidden_modules = [
    "atelier2.__main__",
    "atelier2.host",
    "atelier2.host.**",
    "atelier2.api",
    "atelier2.api.**",
    "atelier2.adapters",
    "atelier2.adapters.**",
    "atelier2.application",
    "atelier2.application.**",
    "atelier2.ports",
    "atelier2.ports.**",
]
as_packages = false

[[tool.importlinter.contracts]]
id = "dbos-owner"
name = "DBOS and SQLAlchemy stay inside their adapter"
type = "forbidden"
source_modules = ["atelier2"]
forbidden_modules = ["dbos", "sqlalchemy"]
allow_indirect_imports = true
as_packages = true
ignore_imports = [
    "atelier2.adapters.dbos.** -> dbos",
    "atelier2.adapters.dbos.** -> sqlalchemy",
]
unmatched_ignore_imports_alerting = "error"

# ADR 0010 §1: the client library and every GitHub concept stay inside the
# GitHub adapter, the same forbidden-import contract shape as `dbos-owner`.
[[tool.importlinter.contracts]]
id = "githubkit-owner"
name = "githubkit stays inside the GitHub adapter"
type = "forbidden"
source_modules = ["atelier2"]
forbidden_modules = ["githubkit", "githubkit_schemas"]
allow_indirect_imports = true
as_packages = true
ignore_imports = [
    "atelier2.adapters.github.** -> githubkit",
    "atelier2.adapters.github.** -> githubkit_schemas",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
id = "wire-projection-split"
name = "Wire schemas name no port type"
type = "forbidden"
source_modules = ["atelier2.api.wire"]
forbidden_modules = ["atelier2.ports", "atelier2.ports.**"]
# A port re-exported through application is still a port the wire named.
allow_indirect_imports = false
as_packages = true

# The vocabulary guard, not the proof: it keeps the port types from seeping back
# into a route that has already been translated. What proves that no route calls
# a port is that the context hands it none — see `ApiUseCases` and the two AST
# checks in `scripts/check_architecture.py`. It carried one exception per route
# that still held its ports; the last one went with the cancellation, so the rule
# now stands with nothing exempted from it.
[[tool.importlinter.contracts]]
id = "route-vocabulary"
name = "Routes name no port type"
type = "forbidden"
source_modules = ["atelier2.api.routes"]
forbidden_modules = ["atelier2.ports", "atelier2.ports.**"]
allow_indirect_imports = true
as_packages = true
unmatched_ignore_imports_alerting = "error"

# One profile, one owner: the closed Draft 2020-12 subset a published `schema`
# revision must satisfy is decided in exactly one module, so a second consumer
# cannot quietly evaluate against a second dialect.
[[tool.importlinter.contracts]]
id = "schema-owner"
name = "JSON Schema evaluation stays inside one profile owner"
type = "forbidden"
source_modules = ["atelier2"]
forbidden_modules = ["jsonschema", "jsonschema_specifications", "referencing"]
allow_indirect_imports = true
as_packages = true
ignore_imports = [
    "atelier2.contracts.schemas_v3 -> jsonschema",
    "atelier2.contracts.schemas_v3 -> jsonschema_specifications",
    "atelier2.contracts.schemas_v3 -> referencing",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
id = "yaml-owner"
name = "PyYAML stays inside its document adapters"
type = "forbidden"
source_modules = ["atelier2"]
forbidden_modules = ["yaml"]
allow_indirect_imports = true
as_packages = true
ignore_imports = [
    "atelier2.adapters.yaml_workflows -> yaml",
    "atelier2.adapters.markdown_agent_definitions -> yaml",
]
unmatched_ignore_imports_alerting = "error"

# Every GitHub credential exchange and the one host API client are the only
# declared callers of httpx; a fifth import site would otherwise reach the
# network with no declared owner.
[[tool.importlinter.contracts]]
id = "httpx-owner"
name = "httpx stays inside its declared transport owners"
type = "forbidden"
source_modules = ["atelier2"]
forbidden_modules = ["httpx"]
allow_indirect_imports = true
as_packages = true
ignore_imports = [
    "atelier2.adapters.github.observation -> httpx",
    "atelier2.adapters.github.live_effects -> httpx",
    "atelier2.adapters.github.project_connections -> httpx",
    "atelier2.host.atelier_api_client -> httpx",
]
unmatched_ignore_imports_alerting = "error"

[tool.ruff.lint.per-file-ignores]
# Runtime lifecycle must preserve the initiating failure while collecting every
# independently failing third-party cleanup operation.
"src/atelier2/adapters/dbos/runtime.py" = ["BLE001"]

[tool.hatch.build.targets.wheel]
packages = ["src/atelier2"]
