format_version: 3
name: push-before-open-pr
description: >-
  One workspace-tool builder implements the ordered work item where it
  stands and publishes its captured candidate through the
  push-atelier-commit grant before the successor opens the matching pull
  request from that confirmed push receipt.
graph_inputs:
  - name: work_item
    schema:
      ref: work-item
      revision: "0bffb19e43509cb4cb446dd33c1d70b0d19f8a9a65cbe270d382edc2860d2921"
nodes:
  - id: implement
    type: agent
    role: builder
    # The pinned grant carries Grok 4.6's committer identity. The pin below
    # is the cast's default for an unbound role; a start that binds this
    # role explicitly owns matching the committer itself.
    model: grok-4.6
    mode: headless_with_tools
    instruction: >-
      You are working in an isolated snapshot of the repository at the pinned
      commit: deliberately no .git directory, no gh, no agent-claim, and no
      board access. The lane claim is already held outside this workspace, so
      the repository's guidance about claiming and pushing does not apply
      here. Implement the named work item by editing the files in this
      workspace. Your edited workspace is the candidate: once you finish, the
      atelier captures it and publishes it through the push-atelier-commit
      grant on its own -- you do not call any tool to publish, and no publish
      tool exists here. When the change is complete, return a concise JSON
      string summarizing the candidate you produced.
    tools:
      - ref: push-atelier-commit
        revision: "32eb46fb44f23c97a7b978a9de08c8a764281e6944426bb823329cfc7f9c5b1a"
    # The workspace executor's default turn cap is sized for the
    # read-then-answer class and died mid-implementation (gh:926 run 3);
    # this budget covers explore+edit+verify+push with headroom while
    # still cutting off a wedged attempt within minutes.
    budget:
      ref: push-implement
      revision: "da6b2bf8fbf5e16b31cd788c4547003f970422aaf2316eb9d2b485b676707b15"
    inputs:
      - name: work_item
        from:
          graph_input: work_item
    outputs:
      - name: result
        schema:
          ref: nonempty_string
          revision: "efee11cebb880d0df169aab4de57cc50901261b5e17328a62faa26f442173f95"
  - id: open-pull-request
    type: action
    operation:
      ref: open-pr
      revision: "420440a07ba8d6f2ba953d02e50d3889a4128ce42fe3e8562fead9523e341f37"
    depends_on: [implement]
    inputs:
      - name: body
        from:
          node: implement
          output: result
