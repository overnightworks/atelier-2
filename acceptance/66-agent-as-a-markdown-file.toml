schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/66"

# The reconstruction sentence below proves the durable half of #66's fifth
# acceptance sentence (ruling 5300492366): the published agent_definition
# revision holds the exact authored bytes, and parsing them back yields the
# identical definition. Showing that reconstruction in the cockpit/preview is
# the named rest, owned by #66's Done-when.

[[sentence]]
id = "a-markdown-file-becomes-a-published-configuration-revision"
text = "A markdown file with frontmatter and a prompt body becomes a published agent-configuration revision deterministically, over the existing catalog API and without a new schema."

[[sentence]]
id = "missing-frontmatter-minimum-is-refused-unknown-keys-are-carried"
text = "A missing minimum frontmatter field (name, description) is refused by name in a typed refusal; a frontmatter key the atelier does not model is never guessed at or dropped, and is instead carried through opaquely in the definition's own bytes."

[[sentence]]
id = "an-absent-tool-declaration-leaves-every-tool-and-a-declared-one-is-exact"
text = "An agent whose file declares no tools may use every tool, and an agent whose file declares them may use exactly that set, visible in the contract: the restriction is explicit, never implicit."

[[sentence]]
id = "the-same-file-is-the-same-revision-identity"
text = "The same authored file is the same revision identity, and every authored difference is a different one."

[[sentence]]
id = "the-published-revision-reconstructs-the-definition"
text = "From a published agent-definition revision, read back by its hash, the authored definition is reconstructable: name, description, model, tools, and system prompt come back identical."

[[sentence]]
id = "a-catalog-intake-keeps-the-kind-it-was-handed-in"
text = "A catalog intake stores and reads back exactly the closed kind handed in with its opaque bytes; the same bytes under agent and skill are distinct intakes, and no content recognition changes either declaration."
