name: CI

on:
  pull_request:
    branches:
      - main
      - "integration/**"
      - "fable/**"
      - "agent/**"
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]

# A pull request collapses onto its newest push, but every push to main gets a
# group of its own, so no main run is ever cancelled — and none is evicted
# while pending, which a shared group would do to the middle of three quick
# landings. The secret gate scans a range, so a run that dies leaves its
# commits read by nobody: the next push begins its range at the dead run's
# head. The price, named: several main runs can be in flight at once. The
# merge queue tests one candidate per group as its own event, so its group key
# folds in `github.event_name`: a `merge_group` run for a candidate never
# shares a group with -- and so never cancels or is cancelled by -- the
# `pull_request` run testing the same commit outside the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: "Cockpit: types, lint, tests, e2e"
    runs-on: ubuntu-latest
    # ~9min üblich, gemessen 30.08. (12 grüne main-Runs; mean 514s, max 559s)
    # inklusive #742's zweitem (reversed) e2e-Durchlauf; der damals
    # ausstehende Mittelwert ist damit gemessen und bestätigt das verdoppelte
    # Budget: max ist 58% der Wand.
    # 04.09.2026: sechs Abbrüche an der 16min-Wand auf GitHub-gehosteten
    # Runnern (PR #1126 zweimal, #1136, #1134, main fd7ca7ca, main ead359a5) -
    # `npm ci` brauchte ~7min statt ~14s, Playwright ~9.5min; Wand auf 30min
    # angehoben, faengt weiterhin einen haengenden Job, uebersteht aber einen
    # langsamen Runner.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.13"
          version: "0.10.9"

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check frontend types
        run: npm run check

      - name: Lint frontend source
        run: npm run lint

      - name: Check for dead cockpit code
        run: npm run check:dead

      - name: Test frontend behavior
        run: |
          npm test -- --reporter=default --reporter=json --outputFile=../reports/frontend.vitest.json \
            --coverage --coverage.reporter=lcov --coverage.reportsDirectory=../reports/frontend-coverage

      - name: Build the production cockpit
        run: npm run build

      - name: Install locked backend dependencies
        working-directory: .
        run: uv sync --locked --all-groups

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install the browser's OS dependencies
        run: |
          set -euo pipefail
          install_deps_ok=false
          for attempt in 1 2 3; do
            if timeout 90 npx playwright install-deps chromium; then
              install_deps_ok=true
              break
            fi
            echo "playwright install-deps attempt ${attempt} failed or timed out after 90s" >&2
          done
          if [ "${install_deps_ok}" != true ]; then
            echo "::error::playwright install-deps did not succeed after 3 attempts (90s each) — failing the step instead of hanging until the job timeout" >&2
            exit 1
          fi

      - name: Install the browser
        run: |
          set -euo pipefail
          if ! timeout 240 npx playwright install chromium; then
            echo "::error::playwright install chromium did not succeed within 240s — failing the step instead of hanging until the job timeout" >&2
            exit 1
          fi

      - name: Test the production cockpit in Chromium
        run: |
          set -euo pipefail
          unit=""
          cleanup() {
            status="$1"
            trap - EXIT INT TERM
            if [ -n "${unit}" ]; then
              sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
              sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            fi
            exit "${status}"
          }
          trap 'cleanup "$?"' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM
          npm_path="$(command -v npm)"
          npx_path="$(command -v npx)"
          run_e2e() {
            script="$1"
            suffix="$2"
            unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-frontend-${suffix}"
            sudo systemd-run --quiet --wait --collect --pipe \
              --unit="${unit}" \
              --uid="$(id -u)" \
              --gid="$(id -g)" \
              --property=Type=exec \
              --property=Delegate=yes \
              --property=DelegateSubgroup=workload \
              --property=KillMode=control-group \
              --property=TimeoutStopSec=15s \
              --working-directory="${GITHUB_WORKSPACE}/frontend" \
              --setenv=HOME="${HOME}" \
              --setenv=PATH="${PATH}" \
              --setenv=CI="${CI:-true}" \
              --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
              --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
              --setenv=UV_PYTHON="${UV_PYTHON}" \
              --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
              --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
              "${npm_path}" run "${script}"
          }
          # The mockup-comparison screenshots (REQ-UIQ-11, #994): its own
          # fresh webServer boot, run first so its own (much smaller)
          # Playwright JSON report is overwritten by the two full runs below
          # rather than the other way around -- the acceptance trace reads
          # that report and must keep seeing every claim the full suite
          # proves.
          run_shots() {
            unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-frontend-shots"
            sudo systemd-run --quiet --wait --collect --pipe \
              --unit="${unit}" \
              --uid="$(id -u)" \
              --gid="$(id -g)" \
              --property=Type=exec \
              --property=Delegate=yes \
              --property=DelegateSubgroup=workload \
              --property=KillMode=control-group \
              --property=TimeoutStopSec=15s \
              --working-directory="${GITHUB_WORKSPACE}/frontend" \
              --setenv=HOME="${HOME}" \
              --setenv=PATH="${PATH}" \
              --setenv=CI="${CI:-true}" \
              --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
              --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
              --setenv=UV_PYTHON="${UV_PYTHON}" \
              --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
              --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
              --setenv=ATELIER2_SHOT_DIR="${GITHUB_WORKSPACE}/frontend/screenshot-review-shots" \
              "${npx_path}" playwright test tests/e2e/vision-shots.spec.ts
          }
          run_shots
          # The shared-server suite proves its own order-independence (#742)
          # by running the identical spec set twice, in its default and its
          # reversed order -- each its own fresh webServer boot.
          run_e2e e2e forward
          run_e2e e2e:reversed reversed

      - name: Upload the cockpit run reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report-frontend
          path: |
            reports/frontend.vitest.json
            reports/frontend.playwright.json
            reports/frontend-coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # The mockup-comparison evidence REQ-UIQ-11 asks a human to look at
      # (#994): every core surface at 1280/390, light/dark. This is what the
      # screenshot review gate's refusal message tells the operator to look
      # at before approving a scope digest.
      - name: Upload the screenshot review evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-review-shots
          path: frontend/screenshot-review-shots
          if-no-files-found: error
          retention-days: 7
          overwrite: true


  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # ~25s üblich, gemessen 30.08. (12 grüne main-Runs; mean 23s, max 26s)
    timeout-minutes: 3
    steps:
      - name: Check out the event commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned gitleaks
        # The gitleaks-action wrapper requires an organization license key;
        # the MIT-licensed binary itself does not, so it is fetched directly
        # and verified against the release checksum.
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      # Reading every ref judged unmerged foreign work and held the trunk and
      # every open pull request red (#968); the range is what this event
      # actually brings. `-m` is load-bearing: a secret introduced only in a
      # merge commit's conflict resolution is invisible without it.
      #
      # The report is written outside the checkout on purpose. The checkout is
      # the pull request's own tree, so a report path inside it could already
      # be a symlink: gitleaks reads the tree's .gitleaks.toml and can exit
      # before overwriting that path, and the upload follows symlinks — which
      # would publish whatever the link points at to a world-readable artifact.
      #
      # A force-push to main can drop the `before` commit off every ref, so it
      # is never fetched and the base does not resolve. The job then fails loud
      # and scans nothing, deliberately: rewriting the trunk's history is for a
      # human to look at, not for this gate to paper over with machinery.
      - name: Scan the event's own commits for secrets
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          SECRET_SCAN_REPORT: ${{ runner.temp }}/gitleaks-report.json
        run: |
          set -euo pipefail
          if ! base_commit="$(git rev-parse --verify --quiet "${SECRET_SCAN_BASE_SHA}^{commit}")"; then
            echo "::error::base revision '${SECRET_SCAN_BASE_SHA}' does not resolve to a commit; refusing to report a scan that covered nothing" >&2
            exit 1
          fi
          scan_status=0
          ./gitleaks git --redact --no-banner \
            --log-opts="${base_commit}..HEAD --diff-filter=uxdb -m" \
            --report-format json --report-path "${SECRET_SCAN_REPORT}" . || scan_status=$?
          if [ -L "${SECRET_SCAN_REPORT}" ] || [ ! -f "${SECRET_SCAN_REPORT}" ]; then
            echo "::error::the scan left no regular report file at ${SECRET_SCAN_REPORT}; there is no evidence to publish" >&2
            exit 1
          fi
          exit "${scan_status}"

      # The repository is public, so its artifacts are world-readable: the
      # report stays redacted and names rule, file, commit, line and author
      # without the value. Findings exit 1, so the upload cannot wait on
      # success; a missing report is already the scan step's loud failure and
      # does not need a second red here.
      - name: Upload the secret-scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  quality:
    name: "Python: architecture, lint, types, tests"
    runs-on: ubuntu-24.04
    # The ruleset requires this exact historical name. This job now publishes
    # the fast static signal while the independent Python test job runs.
    timeout-minutes: 10
    # contents: read is the workflow default; pull-requests: write is this
    # job's own addition, needed only by the corridor report's PR comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.13"
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check architecture contracts
        run: uv run --locked python scripts/check_architecture.py

      - name: Check the size and complexity ratchet
        run: uv run --locked python scripts/check_size_ratchet.py

      - name: Check the core test import ratchet
        run: uv run --locked python scripts/check_core_test_imports.py

      - name: Check for dead production code
        run: uv run --locked python scripts/check_dead_code.py

      - name: Check the frozen OpenAPI document is current
        run: uv run --locked python scripts/write_openapi_frozen.py --check

      - name: Check documentation order
        env:
          REQUIREMENT_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: uv run --locked python scripts/check_documentation_order.py --base-revision "${REQUIREMENT_BASE_SHA}"

      - name: Check product-status partition
        run: uv run --locked python scripts/check_product_status.py

      - name: Check for direct Any parameters in contracts, ports, application, api
        run: uv run --locked ruff check --select ANN401 --no-cache src/atelier2/contracts src/atelier2/ports src/atelier2/application src/atelier2/api

      - name: Check source
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check types
        run: uv run --locked pyright src tests scripts

      # REQ-UIQ-11's freshness gate (#994): refuses without a ledger entry
      # whose scope digest matches HEAD. The ledger ships empty, so this is
      # expected to refuse until the operator approves the screenshot
      # artifact the frontend job uploads and a matching entry lands in
      # docs/requirements/0003-ziel-ui-screenshot-reviews.toml. It stays last
      # so its designed refusal never swallows another static gate's signal.
      - name: Check screenshot review freshness
        run: uv run --locked python scripts/check_screenshot_review.py

      # AGENTS.md's slice corridor (three production files, a hundred changed
      # production lines): reported, never gated, because a check cannot judge
      # a cut. Always exits 0; only over the corridor does it write the job
      # summary and update its one pull request comment.
      - name: Report the change corridor
        env:
          CORRIDOR_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run --locked python scripts/report_corridor.py \
              --base "${CORRIDOR_BASE_SHA}" \
              --pull-request-number "${{ github.event.pull_request.number }}"
          else
            uv run --locked python scripts/report_corridor.py --base "${CORRIDOR_BASE_SHA}"
          fi

  tests:
    name: "Python: tests"
    runs-on: ubuntu-24.04
    # Coverage makes pytest a ~17min job. It runs independently so the static
    # gates report without waiting for the suite.
    timeout-minutes: 35
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.13"
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Test non-crash behavior
        run: |
          set -euo pipefail
          unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-tests"
          cleanup() {
            status="$1"
            trap - EXIT INT TERM
            sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap 'cleanup "$?"' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM
          uv_path="$(command -v uv)"
          sudo systemd-run --quiet --wait --collect --pipe \
            --unit="${unit}" \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --property=Type=exec \
            --property=Delegate=yes \
            --property=DelegateSubgroup=workload \
            --property=KillMode=control-group \
            --property=TimeoutStopSec=15s \
            --working-directory="${GITHUB_WORKSPACE}" \
            --setenv=HOME="${HOME}" \
            --setenv=PATH="${PATH}" \
            --setenv=CI="${CI:-true}" \
            --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=UV_PYTHON="${UV_PYTHON}" \
            --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
            --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
            "${uv_path}" run --locked pytest --dist loadgroup -n auto \
              --ignore=tests/crash tests -q \
              --cov=src/atelier2 --cov-report=xml:reports/coverage.xml \
              --junitxml="${GITHUB_WORKSPACE}/reports/quality.junit.xml"

      - name: Upload the Python test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report-tests
          path: |
            reports/quality.junit.xml
            reports/coverage.xml
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  crash-recovery:
    name: Crash recovery
    needs: tests
    runs-on: ubuntu-latest
    # ~2,5min üblich, gemessen 30.08. (12 grüne main-Runs; mean 146s, max 150s)
    timeout-minutes: 5
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.13"
          version: "0.10.9"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Test crash-recovery behavior
        run: |
          set -euo pipefail
          unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-crash"
          cleanup() {
            status="$1"
            trap - EXIT INT TERM
            sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap 'cleanup "$?"' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM
          uv_path="$(command -v uv)"
          sudo systemd-run --quiet --wait --collect --pipe \
            --unit="${unit}" \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --property=Type=exec \
            --property=Delegate=yes \
            --property=DelegateSubgroup=workload \
            --property=KillMode=control-group \
            --property=TimeoutStopSec=15s \
            --working-directory="${GITHUB_WORKSPACE}" \
            --setenv=HOME="${HOME}" \
            --setenv=PATH="${PATH}" \
            --setenv=CI="${CI:-true}" \
            --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=UV_PYTHON="${UV_PYTHON}" \
            --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
            --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
            "${uv_path}" run --locked pytest -n auto tests/crash -q \
              --junitxml="${GITHUB_WORKSPACE}/reports/crash.junit.xml"

      - name: Upload the crash-recovery run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report-crash
          path: reports/crash.junit.xml
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  acceptance:
    name: Acceptance trace
    needs: [frontend, quality, tests, crash-recovery]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # ~15s üblich, gemessen 30.08. (12 grüne main-Runs; mean 14s, max 19s)
    timeout-minutes: 3
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.13"
          version: "0.10.9"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      # Named without run_attempt; uploads overwrite, so a job-rerun completes
      # this set instead of splitting it (#396).
      - name: Download the run reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: acceptance-report-*
          path: reports
          merge-multiple: true

      # The body is authored by whoever opened the pull request, so it reaches the
      # gate as a file through the environment and never as text substituted into
      # a shell script.
      - name: Record the acceptance binding the pull request states
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PULL_REQUEST_BODY" > pull-request-body.md

      - name: Check the acceptance trace of the proposed landing (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          uv run --locked python scripts/check_acceptance.py --reports reports \
            --pull-request-body pull-request-body.md 2>&1 | tee acceptance-trace.log

      - name: Check the acceptance trace of a landed commit (main only)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          uv run --locked python scripts/check_acceptance.py --reports reports 2>&1 | tee acceptance-trace.log

      - name: Upload the acceptance trace
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-trace
          path: acceptance-trace.log
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  # Every pull request against the default branch carries a typed
  # `Work-Item:`/`Closes:` or `No-Item:` line so a merge can never leave its
  # own item open; `agent-claim pr-check` owns that semantics (its README's
  # "Landing classification" section). `merge_group` carries no pull request
  # number, so the candidate cannot re-run the check here -- it already ran on
  # the `pull_request` event that armed the candidate -- and this branch only
  # holds the required check name green for the queue.
  landing-classification:
    name: Landing classification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Install uv
        if: ${{ github.event_name == 'pull_request' }}
        # No python-version pin here: this job runs agent-claim's own tool
        # environment via uvx, not this repository's pinned interpreter.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.10.9"

      - name: Check the pull request's typed work-item classification
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from git+https://github.com/overnightworks/agent-claim.git@v0.11.0 agent-claim --repo ${{ github.repository }} pr-check --pr ${{ github.event.pull_request.number }}

      - name: Hold the required check name for the merge queue
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "merge_group carries no pull request number; the classification already ran on the pull_request event that armed this candidate."

  # Ruleset main-protection still requires these exact check names. The Python
  # static job keeps its historical name, and this aggregator keeps its own
  # while refusing unless both Python jobs succeeded.
  static-and-behavior:
    name: Static and behavior
    needs: [quality, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # ~5s üblich, gemessen 30.08. (12 grüne main-Runs; mean 2s, max 4s)
    timeout-minutes: 3
    steps:
      - name: Hold the required check name
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"

  cockpit-static-and-behavior:
    name: Cockpit static and behavior
    needs: frontend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # ~5s üblich, gemessen 30.08. (12 grüne main-Runs; mean 3s, max 4s)
    timeout-minutes: 3
    steps:
      - name: Hold the required check name
        run: test "${{ needs.frontend.result }}" = "success"

  # #1203: SonarCloud's Automatic Analysis cannot read coverage, so this job
  # feeds it the same pytest-cov and vitest reports the tests and frontend
  # jobs already produce. Not a required check yet -- that follows the
  # measurement week described in #1203.
  sonar:
    name: SonarCloud scan
    needs: [tests, frontend]
    runs-on: ubuntu-latest
    # Checkout + artifact download + scan; no test suite runs here.
    timeout-minutes: 10
    steps:
      - name: Check out the event commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Named without run_attempt; uploads overwrite, so a job-rerun completes
      # this set instead of splitting it (#396).
      - name: Download the coverage and test reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: acceptance-report-*
          path: reports
          merge-multiple: true

      - name: SonarCloud scan
        # SonarCloud Cloud refuses CI-based analysis while a project's
        # Automatic Analysis stays enabled ("Automatic Analysis is enabled").
        # The operator switches it off after this job first lands; until then
        # this step may fail without reddening a job nobody requires yet.
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
